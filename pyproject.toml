[project]
name = "labelkit"
version = "1.0.0"
description = "LLM-powered stateless batch pipeline for dedup, quality scoring, auto-annotation and generation of collected data"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
    "jsonpatch>=1.33",
    "jsonpointer>=3.0",
    "datasketch>=1.6",
    "Pillow>=10.0",
    "imagehash>=4.3",
    "json-repair>=0.30",
    "numpy>=1.26",
    "ortools==9.15.6755",
    "rich>=13.7",
]

[project.scripts]
labelkit = "labelkit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labelkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: hits a real configured LLM endpoint; endpoint-specific markers control credentials",
    "deepseek: requires the real DeepSeek endpoint and LABELKIT_DEEPSEEK_KEY",
    "local_llm: requires the real local llama-server endpoint and LABELKIT_LOCAL_KEY",
    "zai: requires the real z.ai endpoint and LABELKIT_ZAI_KEY",
]

[tool.uv]
package = true
