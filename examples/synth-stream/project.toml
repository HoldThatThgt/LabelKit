# 时间流生成教学工程（spec v1.17 场景规划形态）。六条 sequence slot 由
# [[generate.stream.quotas]] 声明配额（ticket_booking 3 + smart_home 3），
# crossed_sessions = 1 ⇒ 总 session 恒推导为 6 − 1 = 5（其中恰有一个真实交叉）；
# 噪音按 noise_ratio = 0.1 精确交付到 [[generate.stream.noise]] 声明的噪音帧类，
# 一条幸存序列原样重发到流尾。M1 在任何 LLM 调用前用 compile_scenario 一次性冻结
# 帧类词、session、timestamp、noise 槽与 duplicate 平移；内容作废只删整条槽位，
# 不重排计划、不重求解。
#
# v1.17 最小学习路径：
#   task_request --chain_response [1200,2400)s + subject_id equal--> acknowledgement
#   acknowledgement --response--> confirmation（且 confirmation 恒为 end）
# request 只能落在工作日的两个日内窗口；ticket_booking 用按类整表覆盖缩窄窗口。
# request.duration 继续绑定 gap_next_s，所以工件里可直接核对 20–40 分钟规则。
# generate.sequence_validator 演示跨帧纯函数验证；它不读环境、网络、墙钟或随机数。
#
# 内容调用的计划基数是每条 sequence slot 一次 brief + 一次 realize、每条 noise slot
# 一次 realize（复用帧类 realize 路径）；duplicates 零 LLM。provider retry 与
# Schema repair 可增加物理请求；真实模型双跑不承诺字节相等。固定 LLM 产物、同版本、
# 同配置与同 seed 下，机械计划可复演（plan_digest 回显于 report）。
#
# 产物：out/synth-labels.jsonl 是序列主输出；
# out/synth-labels.stream.jsonl 是逐帧时间流工件。工件可作为 process 输入重放：
# 沿用 order_by = "meta:ts" 和 gap_s = 3600，重发 session 应在序列级 dedup 命中
# dropped_dup。duplicate 保留源 payload、tier_rank 与已回填 duration，不按新时间轴重算。
#
# 档位构成为恰等集合：两类每档都含 request / acknowledgement / confirmation，
# 再以 followup / progress 区分。ticket_booking 整表覆盖全局档位表，smart_home
# 继承全局表；因此读 tier_rank 时必须同时读 sequence_class。
#
# 运行（凭据只由 config.toml 声明的环境变量名注入）：
#   mkdir -p out && set -a && source ../../.env && set +a
#   uv run labelkit run --config config.toml --project project.toml
schema_version = 1

[run]
output = "./out/synth-labels.jsonl"
modality = "text"                 # 时间流生成恒 text 模态（UI 模态为 v1.13 非目标）
mode = "generate_only"
batch_size = 8                    # 6 条序列 ⇒ 一批跑完
seed = 20260813                   # 机械规划的唯一随机源；固定 LLM 产物时同 seed 可复演

[input]
text_field = "text"               # 工件行的文本字段名（重放时 M2 按同一声明提取）

[stream]                          # 生成侧的铺设契约（复用摄取侧词汇，故可重放）
order_by = "meta:ts"              # 工件行的时间戳字段名由此声明（此处即 "ts"）
gap_s = 3600                      # 大于显式 40 分钟上界，survivor 单独 replay 不拆 session
session_max_len = 12              # crossing 中两条五帧序列与 noise 的联合上限
session_max_span_s = 3000         # 容纳 20–40 分钟链边及其余默认边

[dedup]
enabled = true                    # 序列级判重（成员文本按序拼接的 episode 配方）。
                                  # 本次运行里六条序列各不相同，预期 dropped_dup = 0；
                                  # 重复重发的那条只活在工件，判重演示位在重放。
                                  # 本节三键（minhash_threshold / minhash_num_perm /
                                  # ngram）同时是 M6 交织前序列相似度过滤的参数。

[generate]
enabled = true
llms = ["default"]
num_per_call = 4                  # 平面生成形态的装箱键；时间流形态的 noise 已是逐槽交付
temperature = 0.9                 # brief 与帧实现同温；合成需要多样性——温度过低会让
                                  # 同类的三条序列彼此近重，被序列相似度过滤淘汰
sample_validator = "hooks.py:validate_sample"
sequence_validator = "hooks.py:validate_sequence"
scenario_validator = "hooks.py:validate_scenario"
# 注：seed_examples / standalone_count / num_per_record / seeds_per_call 属平面生成
# 形态，本形态显式书写它们是 CONFIG_ERROR——配额由 [[generate.stream.quotas]] 承载。

[generate.stream]
enabled = true
crossed_sessions = 1              # 交叉 session 数；总 session 恒推导为 6 − 1 = 5
noise_ratio = 0.1                 # 噪音帧 / 任务帧 ≈ 10%，帧数 = round(比例 × 任务帧数)
                                  # ——v1.17 起为精确交付目标
duplicates = 1                    # 原样重发 1 条序列（逐字节同源、零 LLM）到流尾新会话
frame_gap_s = [5, 60]             # 会话内帧起点间隔闭区间（秒）；上界须可整量到微秒
max_attempts_per_slot = 3         # 每个交付槽位的独立预算（本键仅 M6 delivery 消费）

# 有限半开 schedule：唯一时间边界（v1.16 的每 session 一周递推已删除）。start/end
# 必带同一显式 offset；排除日可按本地自然日整日剔除。两个工作日（周一、周二）足够
# 容纳 5 个 session × 1 小时间隔 + 工作日窗口约束——单日 6 小时窗内放不下这条流。
[generate.stream.schedule]
start = "2026-01-05T08:00:00+08:00"
end = "2026-01-06T23:00:00+08:00"

# 成功交付 quota（v1.17）：counts 直接给逐类精确目标；多张表约束同一批 occurrence。
[[generate.stream.quotas]]
name = "six_sequences"            # 自然名称（[a-z0-9_]+，与规则/窗口共享全局唯一域）
period = "schedule"               # 对完整 schedule 应用一次
counts = { ticket_booking = 3, smart_home = 3 }

# 结构化噪音表：frame_class 必须在帧类表内且带非空生成指令，不得出现在任何档位、
# 规则或窗口中；weight 为正整数，noise 目标按最大余额法零抽签分到各噪音类。
[[generate.stream.noise]]
frame_class = "chatter"
weight = 1

# 标准 DECLARE 有限迹语义（v1.17 更名 frame_rules，每条必填 name）；time_s 为半开
# 区间，correlation 为类型敏感相等（v1.17 起无 operator 键，恒为 equal）。
[[generate.stream.frame_rules]]
name = "request_first"
template = "init"
frame_class = "task_request"

[[generate.stream.frame_rules]]
name = "request_exactly_once"
template = "exactly"
frame_class = "task_request"
count = 1

[[generate.stream.frame_rules]]
name = "request_chains_to_ack"
template = "chain_response"
source = "task_request"
target = "acknowledgement"
time_s = [1200, 2400]
correlation = { source_field = "subject_id", target_field = "subject_id" }

[[generate.stream.frame_rules]]
name = "ack_exactly_once"
template = "exactly"
frame_class = "acknowledgement"
count = 1

[[generate.stream.frame_rules]]
name = "ack_pulls_confirmation"
template = "response"
source = "acknowledgement"
target = "confirmation"

[[generate.stream.frame_rules]]
name = "confirmation_closes"
template = "end"
frame_class = "confirmation"

[[generate.stream.frame_rules]]
name = "confirmation_exactly_once"
template = "exactly"
frame_class = "confirmation"
count = 1

# 日内分支为并集；每个 task_request occurrence 还必须在工作日。
[[generate.stream.frame_windows]]
name = "ticket_request_work_hours"
frame_class = "task_request"
of_day = [["08:00", "11:00"], ["14:00", "17:00"]]
of_week = ["mon", "tue", "wed", "thu", "fri"]

# ── 全局档位表：一档 = 一种帧类构成（v1.14）─────────────────────────────────
# 双重身份：档位面的总开关，以及未声明按类表的序列类的回落表。本工程只有 smart_home
# 吃它（ticket_booking 另有按类表，见 [[class.ticket_booking.generate.tiers]]）。
# 配分：smart_home 的配额 3 在权重 2 : 1 上按整数域最大余额法零抽签配分
# ⇒ 2 + 1（2 条一档序列、1 条二档序列），配分是 (配额, 生效表) 的纯函数，不消费任何
# 随机数。
# 长度下界 4 恰好容纳三个规则帧类与一个 filler；第五帧可重复 filler。
[[generate.stream.tiers]]
tier_rank = 1                     # 档位身份（表内唯一、本表连续覆盖 1..N，无 name 键）
weight = 2                        # 配额权重（整数 ≥ 1）
frame_classes = ["task_request", "acknowledgement", "followup", "confirmation"]

[[generate.stream.tiers]]
tier_rank = 2
weight = 1
frame_classes = ["task_request", "acknowledgement", "progress", "confirmation"]

[classify]
enabled = true                    # 类表是 quota 与按类条件化的载体；生成侧标签直接继承
                                  # （inherited，零判决调用 ⇒ report.classify 直方图
                                  # 恒全零是预期），本形态下 ≥1 类即可、fallback 免填

[[classify.classes]]
name = "ticket_booking"
description = "高铁购票类会话：查车次、订票、改签退票、选座与票务证件等围绕一次铁路出行的连续请求"

[[classify.classes]]
name = "smart_home"
description = "智能家居指令类会话：控制灯光空调窗帘等设备、设定定时与场景、查询设备状态的连续指令"

# ── 按类生成：长度区间 + 该类的内容指令（配额由 quota 表承载，sequences 键已删除）──
[class.ticket_booking.generate]
instruction = """
你在为高铁购票场景合成真实用户与语音助手的一次对话序列。序列围绕**同一次出行**
展开：从提出购票诉求开始，逐步补全或修改出发地、目的地、日期时段、车次坐席、
同行人、证件等要素，最后收尾确认。要求口语化、中文、每帧一句话，前后帧之间信息
连贯且有推进（不得原地重复）。
"""
len_range = [4, 5]                # length 在 slot 构建期由 scenario.preference 流冻结

# 按类档位表（v1.15）：整表取代全局表——本类的序列只在下面这两档里取构成，全局表对它
# 完全不生效。本表交换 followup / progress 的 rank，权重方向也与全局表相反，
# 直接展示 tier_rank 只是类内身份。
[[class.ticket_booking.generate.tiers]]
tier_rank = 1                     # 类内身份：本表自己连续覆盖 1..2，与全局表的 rank 不可比
weight = 1
frame_classes = ["task_request", "acknowledgement", "progress", "confirmation"]

[[class.ticket_booking.generate.tiers]]
tier_rank = 2
weight = 2
frame_classes = ["task_request", "acknowledgement", "followup", "confirmation"]

# 按类 frame_windows 与 tiers 一样是整表覆盖；两个窄窗仍与 smart_home 的全局窗有交集，
# 因此 planner 仍可给两类安排 crossing。
[[class.ticket_booking.generate.frame_windows]]
name = "ticket_booking_request_hours"
frame_class = "task_request"
of_day = [["09:00", "11:00"], ["14:00", "16:00"]]
of_week = ["mon", "tue", "wed", "thu", "fri"]

[class.smart_home.generate]
instruction = """
你在为智能家居场景合成真实用户与语音助手的一次指令序列。序列围绕**同一个居家
场景**展开：从一条设备控制指令开始，逐步追加或修改设备、房间、动作强度、定时与
联动条件，最后收尾确认。要求口语化、中文、每帧一句话，前后帧之间信息连贯且有
推进（不得原地重复）。
"""
len_range = [4, 5]

# ── 按类标注：两类各用一份**独立**的标注 Schema（v1.13 裁决·按类标注 Schema）──
# 覆盖语义：类声明了就用类的，未声明回落全局 [output].schema。两份 Schema 的字段
# 集合刻意不同——购票要抽行程要素、智能家居要抽设备动作，同一个全局 Schema 无法
# 同时贴合两者，这正是按类 Schema 的用武之地。
[class.ticket_booking.annotate]
instruction = """
你是高铁购票会话的标注员。阅读整段请求序列，抽出这次出行的意图（intent，一个
动宾短语）、出发地（origin）、目的地（destination）、出发日期或时段（depart_date，
原文表述即可）以及用户提出的其他约束（constraints，如坐席、车次偏好、同行人、
证件、预算；没有则给空数组）。序列中未提及的字段填空字符串。
"""
schema_inline = """
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "type": "object",
  "properties": {
    "intent": {"type": "string"},
    "origin": {"type": "string"},
    "destination": {"type": "string"},
    "depart_date": {"type": "string"},
    "constraints": {"type": "array", "items": {"type": "string"}}
  },
  "required": ["intent", "origin", "destination", "depart_date", "constraints"],
  "additionalProperties": false
}
"""

[class.smart_home.annotate]
instruction = """
你是智能家居指令会话的标注员。阅读整段指令序列，抽出这次操作的意图（intent，一个
动宾短语）、被操作设备（device）、动作（action，如开启/关闭/调暗/设定温度）、
所在位置（location，如客厅/卧室）与定时或联动条件（schedule，原文表述即可）。
序列中未提及的字段填空字符串。
"""
schema_inline = """
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "type": "object",
  "properties": {
    "intent": {"type": "string"},
    "device": {"type": "string"},
    "action": {"type": "string"},
    "location": {"type": "string"},
    "schedule": {"type": "string"}
  },
  "required": ["intent", "device", "action", "location", "schedule"],
  "additionalProperties": false
}
"""

# ── 帧类表：planner 词在这个闭集上取值，帧类即帧级真值（随 members[] 落盘）────
# frame.classify.enabled 保持 false——真值在生成期已知，无需帧级判决调用。
[[frame.classify.classes]]
name = "task_request"
description = "发起任务的首帧请求：说明诉求并给出已知要素"

[[frame.classify.classes]]
name = "acknowledgement"
description = "助手对请求的结构化受理回执：复述同一 subject_id"

[[frame.classify.classes]]
name = "followup"
description = "对进行中任务的追问、修改、补充约束"

[[frame.classify.classes]]
name = "progress"
description = "助手或系统对当前处理进展的简短说明"

[[frame.classify.classes]]
name = "confirmation"
description = "对助手结果的确认、收尾或致谢"

[[frame.classify.classes]]
name = "chatter"
description = "与任何任务无关的闲聊、感叹或跑题干扰输入"

# ── 按帧类的内容契约（每个帧类都必填 instruction；planner 词覆盖非噪音全表）────
# 声明 schema_* 的帧类 = 结构化帧（帧内容是对象，按 canonical JSON 落工件行的文本
# 字段）；未声明的 = 纯文本帧（帧内容直接是一句话）。此处的 Schema 会被逐位包进
# realize_schema 的 prefixItems 作为子模式，故不写顶层 $schema 声明。
[frame.class.task_request.generate]
instruction = """
产出发起任务的首帧：subject_id 是该序列唯一的简短 ASCII 标识；
utterance 是用户说出的那一句话（口语、中文），entities 逐项
列出这句话里出现的关键要素（地点、日期时段、设备、房间、车次坐席等），没有则给
空数组。
"""
# duration 是绑定给时间轴的字段（见下面的 time_fields 子表）：它照旧写进这份完整的
# 生成 Schema（含 required）——工件里的帧对象要满足它——但会从 LLM 面向的逐位
# Schema 与契约行里被剔除，故不必也不能在 instruction 里要求模型产出它。
schema_inline = """
{
  "type": "object",
  "properties": {
    "subject_id": {"type": "string"},
    "utterance": {"type": "string"},
    "entities": {"type": "array", "items": {"type": "string"}},
    "duration": {"type": "number"}
  },
  "required": ["subject_id", "utterance", "entities", "duration"],
  "additionalProperties": false
}
"""

# 时间字段绑定（仅结构化帧合法）：键 = 生成 Schema 顶层字段名，值 = 语义词表取值
# （闭集四值：ts / gap_prev_s / gap_next_s / elapsed_s）。此处把 duration 绑成
# gap_next_s = 与**本序列下一帧**的间隔秒（序内口径：交叉会话夹进来的外序列帧与噪音
# 帧不计），本序列末帧恒 0.0；值由 harness 在时间戳铺好之后回填，LLM 物理上不生成
# 它。绑定字段的声明类型必须字面恰等（ts ⇒ "string"、其余三值 ⇒ "number"）；若再给
# 它写 minimum 之类的约束关键字，那些既不上行也不被强制（M1 为此发一条 WARN）——时
# 间量的值域由时间轴决定，不受 Schema 数值约束辖制。
[frame.class.task_request.generate.time_fields]
duration = "gap_next_s"

[frame.class.acknowledgement.generate]
instruction = """
产出助手受理回执：subject_id 必须与 task_request 完全相同；utterance 用一句
简短中文确认已受理该请求，不要创建新标识。
"""
schema_inline = """
{
  "type": "object",
  "properties": {
    "subject_id": {"type": "string"},
    "utterance": {"type": "string"}
  },
  "required": ["subject_id", "utterance"],
  "additionalProperties": false
}
"""

[frame.class.followup.generate]
instruction = """
产出一句追问或修改：在已有诉求之上补充约束、更换要素或询问细节，口语、中文、
一句话，须与 brief 给出的该步要点一致。
"""

[frame.class.progress.generate]
instruction = """
产出一句处理进展：说明正在查询、核对或执行什么，须与同序列上下文一致，
中文、一句话。
"""

[frame.class.confirmation.generate]
instruction = """
产出一句确认或收尾：认可助手给出的结果、拍板下单/执行，或补一句致谢，口语、
中文、一句话。
"""

# 噪音帧类（v1.17 结构化噪音表）：纯文本帧 + 非空生成指令即可；每个 noise slot
# 走一次该帧类的 realize 调用，工件 truth.frame_class 实名（不再是 null）。
[frame.class.chatter.generate]
instruction = """
生成与任何任务都无关的干扰输入：用户随口说的闲聊、感叹、纯语气词或跑题的一句话
（如聊天气、聊心情、无意义的重复字），长度 5–20 字，不得包含任何可执行的诉求。
"""

[quality]
enabled = true
mode = "pointwise"
llm = "default"
threshold = 0.3                   # 质量门演示：分低于此的序列落 dropped_lowq。
                                  # 阈值刻意从宽——合成序列本就是照着准则写的，
                                  # 设狠了只会把整批筛空，教学价值反而没了。
# rubric 留空：本形态自动解析为 default:trajectory（轨迹四准则，与流模式同款
# ——打的是序列的分，不是单条文本的分）。

[annotate]
enabled = true
llm = "default"
instruction = """
你是时间流请求序列的标注员。阅读整段序列（按时间先后给出的连续用户请求），
按输出 Schema 抽取这段序列所表达的任务要素；只根据序列内出现的信息作答，
未提及的字段留空，不要臆造。
"""
# 注：本工程的两个序列类各自声明了 [class.<name>.annotate].schema_inline，实际
# 生效的输出 Schema 按行的类标签取——全局 [output].schema 只是未声明类的回落。

[verify]
enabled = true
llm = "default"
policy = "repair"                 # 判决形评审：不合格先按缺陷重标注，仍不合格则淘汰
max_repair_rounds = 1
extra_criteria = "补充审核约定：本序列是合成数据，成员帧之间信息连贯即可，不要求覆盖真实票务/设备系统的全部字段；标注中留空的字段若序列内确实未提及，属正常，不判为缺失"

