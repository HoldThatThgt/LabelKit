# 时间流生成工件的 process 重放教学工程（v1.17）。
# 输入是主工程生成的逐帧工件；M2 按 ts 排序并用同一 gap_s 复演会话。
# segment 把帧组装为序列后，dedup 在全局范围判重，流尾原样重发应出现 dropped_dup。
# structured noise 的 truth.frame_class 透传到 _meta.source.fields，便于对账；truth 不参与
# 排序、分段或判重。输出词干独立，不覆盖生成产物。
#
# 运行（密钥只由 config.toml 声明的环境变量名注入）：
#   set -a && source ../../.env && set +a
#   uv run labelkit run --config config.toml --project project-replay.toml --console plain
schema_version = 1

[run]
input = "./out/synth-labels.stream.jsonl"
output = "./out/replay-labels.jsonl"
modality = "text"
mode = "process"
batch_size = 32
seed = 20260813

[input]
text_field = "text"

[stream]
order_by = "meta:ts"
gap_s = 3600
session_max_len = 12
session_max_span_s = 3000

[segment]
enabled = true
strategy = "hybrid"
llm = "default"
window = 8
min_len = 2
context = """
这是时间流生成器产生的中文任务请求流。相邻的相关请求属于同一任务序列，交叉会话中不同任务可能交错；
纯闲聊、感叹、语气词或无关句子属于噪声帧。按内容判断边界并过滤噪声帧，保留任务的连续推进、补充约束
和确认收尾。不要依据输入中的 truth 字段作判断。
"""

[dedup]
enabled = true
scope = "global"

[quality]
enabled = false

[annotate]
enabled = true
llm = "default"
instruction = """
你是时间流重放结果的标注员。阅读按时间顺序排列的连续请求序列，抽取任务意图和一句话摘要。
只根据序列成员作答；未提及的细节不要臆造。
"""

[output]
meta_mode = "inline"
passthrough_fields = ["truth"]
rejects = "refs"
schema_inline = """
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "type": "object",
  "properties": {
    "intent": {"type": "string"},
    "summary": {"type": "string"}
  },
  "required": ["intent"],
  "additionalProperties": true
}
"""
