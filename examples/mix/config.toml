# Tool-level static config：UI 主工程使用 vision 处理所有完整成员证据。
# default 用于 project-text.toml 纯文本姊妹工程；旧摘要阶段分工不再适用。
# 本示例独立成套、不复用 ../config.toml，偏离共享惯例的理由：双粒度上手示例
# 单目录即完整可跑（独立上手），且 DeepSeek 端点与其余示例共用的 z.ai
# glm-5.2 端点隔离、互不牵连。
#
# DeepSeek 端点实测（2026-08-12，两次真实探针）：文本调用可用、温度 0 可用、
# usage 在场；响应默认携带 thinking 内容块，M9 anthropic 解析器只收集
# type=="text" 块，thinking 被天然跳过，JSON 干净落在 text 块；该路由不支持
# 图像内容块（官方兼容表），故视觉必需阶段走 [llm.vision]。
schema_version = 1

[tool]
log_level = "info"
log_format = "text"

[llm.default]
provider = "anthropic"
base_url = "https://api.deepseek.com/anthropic"
model = "deepseek-v4-flash"
api_key_env = "LABELKIT_DEEPSEEK_KEY"
max_concurrency = 4
timeout_s = 120
max_retries = 5
# 该路由对指定工具强制返回 400（tool_choice type="tool"，2026-08-12 实测，
# E2E-FINDINGS 第 24 条）：结构化输出走 text 块 JSON + Schema 引擎 L1 确定性解析。
supports_structured_output = false
supports_vision = false           # 官方兼容表：image 内容块不支持
max_output_tokens = 4096
context_window = 131072 # 端点标称 1M，按既有 V26 惯例保守声明——实测后可上调
temperature = 0.0

[llm.vision]
provider = "anthropic"
base_url = "https://api.z.ai/api/anthropic"
model = "glm-5.2"
api_key_env = "LABELKIT_ZAI_KEY"
max_concurrency = 4
timeout_s = 120
max_retries = 5
supports_structured_output = true
supports_vision = true
max_output_tokens = 4096
context_window = 131072 # 端点实效保守值（V26）——P6 实测后可上调
temperature = 0.0
